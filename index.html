<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grey Goo</title>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <header class="hud hud-top">
      <div class="brand">GREY&nbsp;GOO</div>

      <div class="group" id="palette">
        <span class="group-label">Block</span>
        <button class="seg tool" data-tool="goo" title="Goo ball (1)">Goo</button>
        <button class="seg tool" data-tool="thruster" title="Thruster (2)">Thruster</button>
        <button class="seg tool" data-tool="sensor" title="Sensor (3)">Sensor</button>
        <button class="seg tool" data-tool="pan" title="Pan (4)">Pan</button>
      </div>

      <div class="group">
        <button class="btn primary" id="launch" title="Launch (Space)">Launch</button>
        <button class="btn" id="reset" title="Back to editor">Reset</button>
        <button class="btn" id="clear">Clear</button>
      </div>

      <div class="stage-pill" id="stage-pill">EDITOR</div>
    </header>

    <aside class="hud hud-panel" id="panel">
      <label class="field">
        <span class="field-label">Thrust <b id="power-val">600</b></span>
        <input id="power" type="range" min="0" max="2000" step="50" value="600" />
      </label>
      <label class="field">
        <span class="field-label">Fluid drag <b id="drag-val">1.5</b></span>
        <input id="drag" type="range" min="0" max="4" step="0.1" value="1.5" />
      </label>
      <label class="field">
        <span class="field-label">Stiffness <b id="stiff-val">0.5</b></span>
        <input id="stiff" type="range" min="0.05" max="1" step="0.05" value="0.5" />
      </label>
      <label class="field">
        <span class="field-label">Connect radius <b id="connect-val">55</b></span>
        <input id="connect" type="range" min="25" max="140" step="5" value="55" />
      </label>

      <div class="stats">
        <div><span>Nodes</span><b id="stat-nodes">0</b></div>
        <div><span>Beams</span><b id="stat-beams">0</b></div>
        <div><span>Distance</span><b id="stat-dist">–</b></div>
      </div>
    </aside>

    <footer class="hud hud-bottom">
      <div id="hint">Left-click to place · drag a block to move · <b>R</b> rotate thruster · right-drag to pan · wheel to zoom</div>
    </footer>

    <div id="banner" class="banner hidden"><span id="banner-text">GOAL REACHED</span></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
