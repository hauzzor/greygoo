<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grey Goo</title>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <header class="hud hud-top">
      <div class="brand">GREY&nbsp;GOO</div>

      <div class="group" id="tools">
        <span class="group-label">Tool</span>
        <button class="seg tool" data-tool="select" title="Drag — pick up & move a block (1)">Drag</button>
        <button class="seg tool" data-tool="pan" title="Pan (2)">Pan</button>
        <button class="seg tool" data-tool="delete" title="Delete — click a block to remove it (3)">Delete</button>
      </div>

      <div class="group">
        <button class="btn primary" id="run" title="Run / pause abilities (Space)">Run</button>
        <button class="btn" id="camera-toggle" title="Lock camera to the selected camera block (C)">Camera</button>
        <select class="select" id="camera-select" title="Camera block to follow"></select>
        <button class="btn" id="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button class="btn" id="clear">Clear</button>
      </div>

      <div class="stage-pill" id="stage-pill">BUILDING</div>
    </header>

    <aside class="hud hud-panel" id="panel">
      <label class="field">
        <span class="field-label">Connect radius <b id="connect-val">90</b></span>
        <input id="connect" type="range" min="25" max="320" step="5" value="90" />
      </label>

      <details class="advanced">
        <summary>Advanced</summary>
        <label class="field">
          <span class="field-label">Thrust <b id="power-val">600</b></span>
          <input id="power" type="range" min="0" max="2000" step="50" value="600" />
        </label>
        <label class="field">
          <span class="field-label">Fluid drag <b id="drag-val">1.5</b></span>
          <input id="drag" type="range" min="0" max="4" step="0.1" value="1.5" />
        </label>
        <label class="field">
          <span class="field-label">Beam rigidity <b id="stiff-val">0.9</b></span>
          <input id="stiff" type="range" min="0.05" max="1" step="0.05" value="0.9" />
        </label>
      </details>

      <div class="stats">
        <div><span>Nodes</span><b id="stat-nodes">0</b></div>
        <div><span>Beams</span><b id="stat-beams">0</b></div>
        <div><span>Loose</span><b id="stat-loose">0</b></div>
        <div><span>Distance</span><b id="stat-dist">–</b></div>
      </div>
    </aside>

    <footer class="hud hud-bottom">
      <div id="hint">Drag a loose block to build · drop it near others to connect · right-drag to pan · wheel to zoom</div>
    </footer>

    <div id="banner" class="banner hidden"><span id="banner-text">GOAL REACHED</span></div>

    <div id="perf" class="perf">FPS – · UPS – · – ms</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
